[package]
name = "p2p-core"
description = "Transfer engine: pairing, sending and receiving files between two peers."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
iroh = "1.4"
iroh-blobs = "0.105"
n0-future = "0.3"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
